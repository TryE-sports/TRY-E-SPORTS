<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRY | Elite E-Sports</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #020205;
            --accent-ocean: #00074d;
            --accent-glow: #0044ff;
            --accent-cyan: #00e5ff;
            --text-main: #ffffff;
            --text-muted: #8b95a5;
            --glass-bg: rgba(10, 15, 30, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --font-display: 'Orbitron', sans-serif;
            --font-body: 'Montserrat', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: var(--font-body);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 50% 0%, #00074d 0%, transparent 50%);
        }

        /* ONDAS ESTÉTICAS MANTIDAS NO FUNDO */
        .ocean-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 15vh;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }
        .wave-wrapper { position: absolute; width: 200%; height: 100%; bottom: 0; }
        .wave-svg { display: block; width: 100%; height: 100%; position: absolute; bottom: 0; }
        .wave-wrapper.back { animation: move_wave 25s linear infinite; opacity: 0.3; }
        .wave-wrapper.back .wave-svg { fill: var(--accent-ocean); }
        .wave-wrapper.front { animation: move_wave 18s linear infinite; opacity: 0.15; filter: blur(2px); }
        .wave-wrapper.front .wave-svg { fill: var(--accent-glow); }

        @keyframes move_wave {
            0% { transform: translateX(0) translateZ(0) scaleY(1); }
            50% { transform: translateX(-25%) translateZ(0) scaleY(0.9); }
            100% { transform: translateX(-50%) translateZ(0) scaleY(1); }
        }

        /* HEADER E LOGO */
        header {
            padding: 40px 0 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .brand-container {
            position: relative;
        }

        .brand {
            font-family: var(--font-display);
            font-size: 3.5rem;
            letter-spacing: 20px;
            color: var(--text-main);
            text-shadow: 0 0 20px rgba(0, 68, 255, 0.5);
            margin-right: -20px;
            font-weight: 900;
        }

        .brand::after {
            content: 'TRY';
            position: absolute;
            top: 0; left: 0;
            color: transparent;
            -webkit-text-stroke: 1px var(--accent-glow);
            filter: blur(4px);
            z-index: -1;
            letter-spacing: 20px;
        }

        /* ESTRUTURA CENTRAL - GLASSMORPHISM */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            padding: 20px;
        }

        .auth-box {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255, 255, 255, 0.15); /* Luz vindo de cima */
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            padding: 50px;
            width: 100%;
            max-width: 460px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 7, 77, 0.2);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .auth-header h2 {
            font-family: var(--font-display);
            letter-spacing: 6px;
            color: var(--text-main);
            font-size: 1.2rem;
            text-transform: uppercase;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 8px;
            letter-spacing: 1px;
        }

        /* INPUTS ESTÉTICOS */
        .input-group { 
            margin-bottom: 20px; 
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            color: var(--text-main);
            outline: none;
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 400;
            transition: all 0.3s ease;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 1px;
        }

        .input-group input:focus { 
            background: rgba(0, 7, 77, 0.3);
            border-color: var(--accent-glow);
            box-shadow: 0 0 15px rgba(0, 68, 255, 0.2);
            transform: translateY(-2px);
        }

        /* BOTÃO CYBER/ELITE */
        .btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--accent-ocean) 0%, var(--accent-glow) 100%);
            color: var(--text-main);
            border: none;
            border-radius: 8px;
            font-family: var(--font-display);
            font-weight: 700;
            letter-spacing: 4px;
            cursor: pointer;
            transition: all 0.4s ease;
            margin-top: 15px;
            font-size: 0.95rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 7, 77, 0.5);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(0, 68, 255, 0.4);
        }

        .btn:hover::before {
            left: 100%;
        }

        /* Responsividade */
        @media (max-width: 600px) {
            .auth-box { padding: 40px 25px; border-radius: 12px; }
            .brand { font-size: 2.5rem; letter-spacing: 12px; margin-right: -12px;}
        }
    </style>
</head>
<body>

    <div class="ocean-container">
        <div class="wave-wrapper back">
            <svg class="wave-svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
                <path d="M0,0V46.29c47.79,22.2,103.59,32.17,158,28,70.36-5.37,136.33-33.31,206.8-37.5C438.64,32.43,512.34,53.67,583,72.05c69.27,18,138.3,24.88,209.4,13.08,36.15-6,69.85-17.84,104.45-29.34C989.49,25,1113-14.29,1200,42.4V120H0Z"></path>
            </svg>
        </div>
        <div class="wave-wrapper front">
            <svg class="wave-svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
                <path d="M0,0V46.29c47.79,22.2,103.59,32.17,158,28,70.36-5.37,136.33-33.31,206.8-37.5C438.64,32.43,512.34,53.67,583,72.05c69.27,18,138.3,24.88,209.4,13.08,36.15-6,69.85-17.84,104.45-29.34C989.49,25,1113-14.29,1200,42.4V120H0Z"></path>
            </svg>
        </div>
    </div>

    <header>
        <div class="brand-container">
            <div class="brand">TRY</div>
        </div>
    </header>

    <div class="container">
        <div class="auth-box">
            <div class="auth-header">
                <h2>Portal de Acesso</h2>
                <p>Registre seu Player ID para entrar na rede.</p>
            </div>
            <form id="registerForm">
                <div class="input-group"><input type="text" id="regName" placeholder="Nome Completo" required autocomplete="off"></div>
                <div class="input-group"><input type="text" id="regNick" placeholder="Nickname Global (ID)" required autocomplete="off"></div>
                <div class="input-group"><input type="text" id="regWhats" placeholder="WhatsApp" required autocomplete="off"></div>
                <div class="input-group"><input type="email" id="regEmail" placeholder="E-mail principal" required autocomplete="off"></div>
                <div class="input-group"><input type="password" id="regPass" placeholder="Senha segura" required></div>
                <button type="submit" class="btn">INICIAR SESSÃO</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.querySelector('.btn');
            const originalText = btn.innerText;
            btn.innerText = 'PROCESSANDO...';
            btn.style.opacity = '0.8';
            
            const userData = {
                name: document.getElementById('regName').value,
                nick: document.getElementById('regNick').value,
                whatsapp: document.getElementById('regWhats').value,
                email: document.getElementById('regEmail').value,
                password: document.getElementById('regPass').value
            };

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });
                
                const result = await response.json();
                
                if(response.ok) {
                    alert("Bem-vindo à elite. Conta criada com sucesso!");
                    document.getElementById('registerForm').reset();
                } else {
                    alert(result.error);
                }
            } catch (err) {
                console.error(err);
                alert("Erro crítico de conexão com a rede TRY.");
            } finally {
                btn.innerText = originalText;
                btn.style.opacity = '1';
            }
        });
    </script>
</body>
</html>
