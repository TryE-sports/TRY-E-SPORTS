<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRY | Elite E-Sports Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --accent-ocean: #00074d;
            --accent-glow: #0026ff;
            --text-pure: #ffffff;
            --font-display: 'Orbitron', sans-serif;
            --font-body: 'Montserrat', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-pure);
            font-family: var(--font-body);
            overflow-x: hidden;
        }

        /* ONDAS RAIVOSAS E AGITADAS */
        .ocean-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        .wave {
            position: absolute;
            left: -10%;
            width: 120%;
            height: 400px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0,0V46.29c47.79,22.2,103.59,32.17,158,28,70.36-5.37,136.33-33.31,206.8-37.5C438.64,32.43,512.34,53.67,583,72.05c69.27,18,138.3,24.88,209.4,13.08,36.15-6,69.85-17.84,104.45-29.34C989.49,25,1113-14.29,1200,42.4V120H0Z" fill="%2300074d"/></svg>') repeat-x;
        }

        /* Múltiplas camadas com velocidades e escalas diferentes para simular maré alta */
        .wave:nth-of-type(1) {
            bottom: -20px;
            opacity: 0.8;
            animation: waveMotion 3s linear infinite;
            transform: scaleY(1.1);
        }
        .wave:nth-of-type(2) {
            bottom: -40px;
            opacity: 0.5;
            animation: waveBack 4s linear infinite;
            transform: scaleY(1.3);
        }
        .wave:nth-of-type(3) {
            bottom: -60px;
            opacity: 0.3;
            animation: waveMotion 2.5s linear infinite;
            transform: scaleY(1.5);
        }
        .wave:nth-of-type(4) {
            bottom: -80px;
            opacity: 0.2;
            animation: waveBack 5s linear infinite;
            transform: scaleY(1.2);
        }

        @keyframes waveMotion {
            0% { background-position-x: 0; }
            100% { background-position-x: -1200px; }
        }

        @keyframes waveBack {
            0% { background-position-x: -1200px; }
            100% { background-position-x: 0; }
        }

        /* INTERFACE MINIMALISTA */
        header {
            padding: 30px 8%;
            display: flex;
            justify-content: space-between;
        }

        .brand {
            font-family: var(--font-display);
            font-size: 2.5rem;
            letter-spacing: 10px;
            color: var(--text-pure);
            text-shadow: 0 0 15px var(--accent-glow);
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .auth-box {
            background: rgba(5, 5, 15, 0.8);
            border: 1px solid var(--accent-ocean);
            padding: 50px;
            width: 100%;
            max-width: 500px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(0, 7, 77, 0.5);
        }

        .auth-box h2 {
            font-family: var(--font-display);
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: 5px;
        }

        .input-group { margin-bottom: 20px; }

        .input-group input {
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            outline: none;
            font-family: var(--font-body);
        }

        .input-group input:focus { border-color: var(--accent-glow); }

        .btn {
            width: 100%;
            padding: 15px;
            background: transparent;
            color: #fff;
            border: 1px solid #fff;
            font-family: var(--font-display);
            letter-spacing: 3px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            background: var(--accent-ocean);
            border-color: var(--accent-glow);
            box-shadow: 0 0 20px var(--accent-glow);
        }
    </style>
</head>
<body>

    <div class="ocean-container">
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
    </div>

    <header>
        <div class="brand">TRY</div>
    </header>

    <div class="container">
        <div class="auth-box">
            <h2>PLAYER ID</h2>
            <form id="registerForm">
                <div class="input-group"><input type="text" id="regName" placeholder="NOME COMPLETO" required></div>
                <div class="input-group"><input type="text" id="regNick" placeholder="NICKNAME GLOBAL (ID)" required></div>
                <div class="input-group"><input type="text" id="regWhats" placeholder="WHATSAPP VÁLIDO" required></div>
                <div class="input-group"><input type="email" id="regEmail" placeholder="E-MAIL" required></div>
                <div class="input-group"><input type="password" id="regPass" placeholder="SENHA" required></div>
                <button type="submit" class="btn">CRIAR CONTA</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const userData = {
                name: document.getElementById('regName').value,
                nick: document.getElementById('regNick').value,
                whatsapp: document.getElementById('regWhats').value,
                email: document.getElementById('regEmail').value,
                password: document.getElementById('regPass').value
            };

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });
                
                const result = await response.json();
                
                if(response.ok) {
                    alert("Bem-vindo à elite. Conta criada com sucesso!");
                    document.getElementById('registerForm').reset();
                } else {
                    alert(result.error);
                }
            } catch (err) {
                console.error(err);
                alert("Erro de conexão com o servidor da Try.");
            }
        });
    </script>
</body>
</html>
